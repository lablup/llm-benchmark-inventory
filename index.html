<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="텍스트, 이미지와 서빙 영역별 LLM 벤치마크 인벤토리입니다.">
    <meta name="theme-color" content="#f5f5f7">
    <title>LLM Benchmark Inventory</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="landing-page">
    <header class="landing-header shell">
      <a class="landing-brand" href="./index.html" aria-label="LLM Benchmark Inventory 홈">
        <span class="landing-mark" aria-hidden="true">LBI</span>
        <span>Benchmark Inventory</span>
      </a>
      <a class="landing-github" href="https://github.com/lablup/llm-benchmark-inventory">GitHub ↗</a>
    </header>

    <main class="landing-main shell">
      <section class="landing-intro" aria-labelledby="landing-title">
        <p>LLM BENCHMARK INVENTORY</p>
        <h1 id="landing-title">평가할 대상을<br>선택하세요.</h1>
        <span>텍스트 모델, 이미지 모델과 서빙 시스템의 평가 자료를 구분해 제공합니다.</span>
      </section>

      <nav class="route-map" aria-label="벤치마크 영역 선택">
        <svg class="route-lines" viewBox="0 0 1180 510" preserveAspectRatio="none" aria-hidden="true">
          <path class="route route--text" d="M50 255 C145 255 123 94 250 94 S380 168 454 128" />
          <path class="route route--vision" d="M50 255 C158 255 165 420 310 420 S476 300 594 350" />
          <path class="route route--serving" d="M50 255 C213 255 289 240 438 240 S635 86 790 104 S936 246 1125 246" />
          <circle cx="50" cy="255" r="6" />
          <circle class="route-dot route-dot--text" cx="454" cy="128" r="7" />
          <circle class="route-dot route-dot--vision" cx="594" cy="350" r="7" />
          <circle class="route-dot route-dot--serving" cx="1125" cy="246" r="7" />
        </svg>

        <div class="route-origin" aria-hidden="true"><span></span><p>Inventory</p></div>

        <section class="route-card route-card--text" aria-labelledby="text-title">
          <p class="route-label">MODEL EVALUATION</p>
          <h2 id="text-title">텍스트</h2>
          <div class="route-links">
            <a href="./korean.html">한국어 <span>→</span></a>
            <a href="./english.html">English <span>→</span></a>
          </div>
        </section>

        <section class="route-card route-card--vision" aria-labelledby="vision-title">
          <p class="route-label">VISION EVALUATION</p>
          <h2 id="vision-title">이미지</h2>
          <div class="route-links">
            <a href="./korean.html?modality=vision">한국어 <span>→</span></a>
            <a href="./english.html?modality=vision">English <span>→</span></a>
          </div>
        </section>

        <section class="route-card route-card--serving" aria-labelledby="serving-title">
          <p class="route-label">SYSTEM PERFORMANCE</p>
          <h2 id="serving-title">서빙</h2>
          <div class="route-links route-links--single">
            <a href="./serving.html">자료 보기 <span>→</span></a>
          </div>
        </section>
      </nav>
    </main>

    <footer class="landing-footer shell">
      <p>Maintained by <a href="https://www.lablup.com">Lablup</a></p>
      <p>Source data on <a href="https://github.com/lablup/llm-benchmark-inventory">GitHub</a></p>
    </footer>
  </body>
</html>
