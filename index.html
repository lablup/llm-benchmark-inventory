<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="텍스트, 이미지와 리소스 영역별 LLM 벤치마크 인벤토리입니다.">
    <meta name="theme-color" content="#f8f4eb">
    <title>LLM Benchmark Inventory</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="illustrated-page">
    <header class="illustrated-header">
      <a class="illustrated-brand" href="./index.html" aria-label="LLM Benchmark Inventory 홈">
        <span aria-hidden="true">LBI</span>
        <strong>Benchmark Inventory</strong>
      </a>
      <a class="illustrated-github" href="https://github.com/lablup/llm-benchmark-inventory">GitHub ↗</a>
    </header>

    <main class="illustrated-main">
      <div class="map-canvas">
        <picture>
          <source media="(max-width: 620px)" srcset="./assets/landing-map-mobile.webp">
          <img src="./assets/landing-map-desktop.webp" alt="하나의 길이 이미지 평가, 텍스트 평가와 리소스의 다섯 갈래로 나뉘는 손그림 지도">
        </picture>

        <div class="map-title">
          <p>LLM BENCHMARK INVENTORY</p>
          <h1>평가 자료 선택</h1>
        </div>

        <nav class="map-destinations" aria-label="평가 자료 선택">
          <a class="map-destination map-destination--image-ko" href="./korean.html?modality=vision">
            <span>이미지</span><strong>한국어</strong><b aria-hidden="true">→</b>
          </a>
          <a class="map-destination map-destination--image-en" href="./english.html?modality=vision">
            <span>이미지</span><strong>English</strong><b aria-hidden="true">→</b>
          </a>
          <a class="map-destination map-destination--text-ko" href="./korean.html">
            <span>텍스트</span><strong>한국어</strong><b aria-hidden="true">→</b>
          </a>
          <a class="map-destination map-destination--text-en" href="./english.html">
            <span>텍스트</span><strong>English</strong><b aria-hidden="true">→</b>
          </a>
          <a class="map-destination map-destination--resources" href="./serving.html">
            <span>시스템</span><strong>리소스</strong><b aria-hidden="true">→</b>
          </a>
        </nav>
      </div>
    </main>
  </body>
</html>
