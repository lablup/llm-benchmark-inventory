name: Check Claude subscription authentication

on:
  workflow_dispatch:
    inputs:
      subscription_only_confirmed:
        description: "Account owner confirmed paid extra usage and automatic usage-credit spending are disabled"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: claude-subscription-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require subscription-only authorization
        env:
          CONFIRMED: ${{ inputs.subscription_only_confirmed }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          test "$CONFIRMED" = "true"
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
      # Only subscription OAuth is passed. No API/cloud credential or fallback.
      # The owner confirmed extra usage is off; the model cannot attest billing.
      - name: Make one bounded subscription request
        id: claude
        uses: anthropics/claude-code-action@c2b6a53127258e3963e8ec37c9a4ca5b853c1e54 # v1
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: 'Return the structured object {"ok":true}. Do not read files, call tools, or comment on GitHub.'
          settings: '{"disableAllHooks":true}'
          claude_args: >-
            --model sonnet
            --max-turns 2
            --tools ""
            --disallowedTools "mcp__*"
            --setting-sources ""
            --json-schema '{"type":"object","properties":{"ok":{"type":"boolean","const":true}},"required":["ok"],"additionalProperties":false}'
      - name: Check the structured response
        env:
          RESPONSE: ${{ steps.claude.outputs.structured_output }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          python3 - <<'PY'
          import json, os
          if os.environ["CONCLUSION"] != "success":
              raise SystemExit("Claude request did not succeed; no fallback is configured")
          result = json.loads(os.environ["RESPONSE"])
          if result != {"ok": True} or type(result.get("ok")) is not bool:
              raise SystemExit("Invalid smoke response")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as report:
              report.write("Subscription-token request succeeded. Owner confirmed extra usage is disabled. "
                           "No paper investigation or inventory mutation was performed.\n")
          PY
