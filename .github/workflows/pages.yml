name: Validate and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 11:30 Asia/Seoul. GitHub may start scheduled runs later when busy.
    - cron: "30 2 * * *"
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: inventory-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'issue_comment' || (contains(github.event.issue.labels.*.name, 'arxiv-review') && github.event.comment.user.login == (vars.ARXIV_REVIEWER || 'songys') && !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inventory data
        run: python3 validate_inventory.py
      - name: Test discovery, evidence and approval handling
        run: python3 -m unittest -v test_arxiv_watch.py test_research.py
      - name: Generate site data
        run: python3 build_site_data.py
      - name: Verify generated files are current
        run: git diff --exit-code -- inventory-data.js serving-data.js site-meta.js
      - name: Check script syntax
        run: |
          python3 -m py_compile build_benchmark_inventory.py build_site_data.py validate_inventory.py arxiv_watch.py build_pages.py research_pipeline.py review_proposals.py
          node --check app.js
          node --check english-copy.js
          node --check landing.js
          node --check serving.js
          node --check papers.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect new arXiv papers
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 arxiv_watch.py
      - name: Install PDF text extraction
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Investigate papers and verify proposals
        id: research
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          ARXIV_DURABLE_CHECKPOINT: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 research_pipeline.py
      - name: Apply reviewer decisions and notify researched proposals
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          ARXIV_REVIEWER: ${{ vars.ARXIV_REVIEWER || 'songys' }}
        run: python3 review_proposals.py
      - name: Persist research progress and approved changes
        # Preserve budget/crash checkpoints even if a paid call failed. The
        # review script rolls back all inventory writes if its transaction fails.
        if: always() && !cancelled()
        run: |
          python3 validate_inventory.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add new-papers.json research/proposals.json korean_benchmark_inventory.csv english_benchmark_inventory.csv english-copy.js benchmark-modalities.json README.md inventory-data.js serving-data.js site-meta.js
          if ! git diff --cached --quiet; then
            git commit -m "Update research progress and approved inventory changes"
            git push origin HEAD:main
          fi
      - name: Keep investigation logs for diagnosis
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: research-logs-${{ github.run_id }}
          path: |
            .research-cache/**/*.jsonl
            .research-cache/**/*.manifest.json
          if-no-files-found: ignore
          retention-days: 7
      # GITHUB_TOKEN commits do not trigger another run; deploy in this run.
      - uses: actions/configure-pages@v5
      - name: Stage public files
        run: python3 build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm persisted decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 review_proposals.py --acknowledge
