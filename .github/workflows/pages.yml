name: Validate and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 09:23 Asia/Seoul. GitHub may start scheduled runs later when busy.
    - cron: "23 0 * * *"
  issues:
    types: [edited, closed, reopened]

permissions:
  contents: read

concurrency:
  group: inventory-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'arxiv-review')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate inventory data
        run: python3 validate_inventory.py
      - name: Test arXiv discovery and review recovery
        run: python3 -m unittest -v test_arxiv_watch.py
      - name: Generate site data
        run: python3 build_site_data.py
      - name: Verify generated files are current
        run: git diff --exit-code -- inventory-data.js serving-data.js site-meta.js
      - name: Check script syntax
        run: |
          python3 -m py_compile build_benchmark_inventory.py build_site_data.py validate_inventory.py arxiv_watch.py build_pages.py
          node --check app.js
          node --check english-copy.js
          node --check landing.js
          node --check serving.js
          node --check papers.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect new arXiv papers and prepare review issues
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ARXIV_REVIEWER: ${{ vars.ARXIV_REVIEWER || 'songys' }}
        run: python3 arxiv_watch.py --github
      - name: Synchronize review checkboxes
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ARXIV_REVIEWER: ${{ vars.ARXIV_REVIEWER || 'songys' }}
        run: python3 arxiv_watch.py --github --issues-only
      - name: Validate refreshed data
        run: python3 validate_inventory.py
      - name: Persist collection and review state
        run: |
          if ! git diff --quiet -- new-papers.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add new-papers.json
            git commit -m "Update arXiv candidates and review status"
            git push origin HEAD:main
          fi
      # A push using GITHUB_TOKEN does not start another workflow. This run
      # continues through deployment with exactly the state it just committed.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Generate site data
        run: python3 build_site_data.py
      - name: Stage public files
        run: python3 build_pages.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
