name: Validate and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      screening_smoke:
        description: "Screen at most 10 cached abstracts only, without full-text investigation or applying changes"
        type: boolean
        default: false
      claude_replay_key:
        description: "Optional held arXiv ID to revise and audit with Claude, using citation_replay_run evidence"
        type: string
        default: ""
      citation_replay_run:
        description: "Completed run ID containing original evidence for claude_replay_key"
        type: string
        default: ""
      reaudit_key:
        description: "Held, rejected or needs_evidence arXiv ID to investigate again from the PDF under the current publication policy"
        type: string
        default: ""
  schedule:
    # 11:30 Asia/Seoul. GitHub may start scheduled runs later when busy.
    - cron: "30 2 * * *"
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: inventory-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'issue_comment' || (contains(github.event.issue.labels.*.name, 'arxiv-review') && github.event.comment.user.login == (vars.ARXIV_REVIEWER || 'songys') && !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inventory data
        run: python3 validate_inventory.py
      - name: Test discovery, evidence and approval handling
        # Buffer successful tests so simulated outages do not become annotations.
        # Failed-test output and real collection warnings remain visible.
        run: python3 -m unittest --buffer -v test_arxiv_watch.py test_research.py test_research_records.py test_abstract_screening.py test_pdf_evidence.py test_replay_citations.py test_claude_subscription_trial.py test_claude_approval.py test_publication_checks.py
      - name: Generate site data
        run: |
          python3 build_site_data.py
          python3 build_research_records.py
      - name: Verify generated files are current
        run: |
          git diff --exit-code -- inventory-data.js serving-data.js site-meta.js updates.json research/archive
          test -z "$(git ls-files --others --exclude-standard -- research/archive updates.json)"
      - name: Check script syntax
        run: |
          python3 -m py_compile build_benchmark_inventory.py build_site_data.py validate_inventory.py arxiv_watch.py build_pages.py research_pipeline.py review_proposals.py build_research_records.py pdf_evidence.py prepare_mineru.py smoke_pdf_evidence.py replay_citations.py claude_approval.py publication_checks.py
          node --check app.js
          node --check english-copy.js
          node --check landing.js
          node --check serving.js
          node --check papers.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    timeout-minutes: 150
    permissions:
      actions: read
      contents: write
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Collect new arXiv papers
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.screening_smoke && !inputs.citation_replay_run && !inputs.reaudit_key)
        run: python3 arxiv_watch.py --allow-cached
      - name: Install PDF evidence runtime
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.screening_smoke && !inputs.citation_replay_run)
        uses: ./.github/actions/pdf-tools
      - name: Resolve source evidence run
        if: github.event_name == 'workflow_dispatch' && inputs.citation_replay_run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.citation_replay_run }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          test "${{ inputs.screening_smoke }}" != "true"
          base_commit=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)
          echo "REPLAY_BASE_COMMIT=$base_commit" >> "$GITHUB_ENV"
      - name: Restore original PDFs and model responses
        if: github.event_name == 'workflow_dispatch' && inputs.citation_replay_run
        uses: actions/download-artifact@v4
        with:
          name: research-logs-${{ inputs.citation_replay_run }}
          run-id: ${{ inputs.citation_replay_run }}
          github-token: ${{ github.token }}
          path: .research-cache/replay-source
      - name: Install official Claude Code
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm install --global @anthropic-ai/claude-code@2.1.304
      - name: Investigate papers and verify proposals
        id: research
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          ARXIV_DURABLE_CHECKPOINT: "1"
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.citation_replay_run }}
          CLAUDE_REPLAY_KEY: ${{ inputs.claude_replay_key }}
          REAUDIT_KEY: ${{ inputs.reaudit_key }}
        run: |
          if [ -n "$SOURCE_RUN" ]; then
            test -n "$CLAUDE_REPLAY_KEY"
            python3 claude_approval.py --artifact .research-cache/replay-source --base-commit "$REPLAY_BASE_COMMIT" --key "$CLAUDE_REPLAY_KEY"
          elif [ -n "$REAUDIT_KEY" ]; then
            python3 research_pipeline.py --reaudit "$REAUDIT_KEY"
          elif [ "${{ inputs.screening_smoke }}" = "true" ]; then
            python3 research_pipeline.py --screening-smoke
          else
            python3 research_pipeline.py
          fi
      - name: Apply changes approved by Claude
        id: review
        if: ${{ always() && !cancelled() && !inputs.screening_smoke }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARXIV_REVIEWER: ${{ vars.ARXIV_REVIEWER || 'songys' }}
        run: python3 review_proposals.py
      - name: Persist research progress and approved changes
        id: persist
        # Preserve budget/crash checkpoints even if a paid call failed. The
        # review script rolls back all inventory writes if its transaction fails.
        if: always() && !cancelled()
        run: |
          python3 validate_inventory.py
          python3 build_research_records.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add new-papers.json research/proposals.json updates.json research/archive/ korean_benchmark_inventory.csv english_benchmark_inventory.csv benchmark_top_models.csv english-copy.js benchmark-modalities.json README.md inventory-data.js serving-data.js site-meta.js
          if ! git diff --cached --quiet; then
            git commit -m "Update research progress and approved inventory changes"
            git push origin HEAD:main
          fi
      - name: Keep investigation logs for diagnosis
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: research-logs-${{ github.run_id }}
          path: |
            .research-cache/**/*.jsonl
            .research-cache/claude/**/*.json
            .research-cache/**/*.manifest.json
            .research-cache/**/*.pages.json
            .research-cache/**/*.mineru.log
            .research-cache/**/replay-report.json
            .research-cache/*/*.pdf
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
      # GITHUB_TOKEN commits do not trigger another run; deploy in this run.
      - uses: actions/configure-pages@v5
        if: ${{ always() && !cancelled() && steps.persist.outcome == 'success' && steps.review.outcome != 'failure' }}
      - name: Stage public files
        id: stage
        if: ${{ always() && !cancelled() && steps.persist.outcome == 'success' && steps.review.outcome != 'failure' }}
        run: python3 build_pages.py
      - uses: actions/upload-pages-artifact@v3
        id: upload
        if: ${{ always() && !cancelled() && steps.stage.outcome == 'success' }}
        with:
          path: _site
      - name: Deploy
        id: deployment
        if: ${{ always() && !cancelled() && steps.upload.outcome == 'success' }}
        uses: actions/deploy-pages@v4
      - name: Confirm persisted decisions
        if: ${{ always() && !cancelled() && !inputs.screening_smoke && steps.deployment.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 review_proposals.py --acknowledge
